<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger &amp; Co. — General Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="store">

  <!-- Hanging shop sign -->
  <header class="sign-wrap">
    <div class="sign-chain"></div>
    <div class="sign-board">
      <span class="sign-line1">Ledger &amp; Co.</span>
      <span class="sign-line2">General Store — Est. Today</span>
    </div>
  </header>

  <!-- Main counter surface -->
  <main class="counter">

    <!-- The receipt printer: this IS the AI clerk -->
    <div class="printer">
      <div class="printer-body">
        <div class="printer-slot"></div>
        <span class="printer-label">Clerk Register</span>
      </div>

      <div class="receipt" id="receipt">
        <div class="receipt-torn top" aria-hidden="true"></div>
        <div class="receipt-scroll" id="receiptScroll">
          <div class="receipt-header">
            <div class="r-store-name">LEDGER &amp; CO.</div>
            <div class="r-sub">ask the clerk anything about stock</div>
            <div class="r-dash">— — — — — — — — — — — —</div>
          </div>
          <div class="receipt-lines" id="receiptLines"></div>
        </div>
      </div>

      <form class="ticket-form" id="chatForm">
        <input type="text" id="chatInput" autocomplete="off" placeholder="type a request for the clerk..." />
        <button type="submit" id="sendBtn">Ring up</button>
      </form>
    </div>

  </main>

  <!-- Drawer pull tab, always visible on the edge -->
  <button class="drawer-tab" id="drawerTab" aria-expanded="false" aria-controls="drawer">
    <span class="tab-handle"></span>
    <span class="tab-text">Ledger drawer</span>
  </button>

  <!-- The cash drawer: slides in over the counter -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-inner">
      <div class="drawer-head">
        <h2>Ledger drawer</h2>
        <button class="drawer-close" id="drawerClose" aria-label="Close drawer">&times;</button>
      </div>

      <nav class="drawer-tabs">
        <button class="dtab-btn active" data-tab="items">Items</button>
        <button class="dtab-btn" data-tab="categories">Categories</button>
        <button class="dtab-btn" data-tab="audit">Audit</button>
      </nav>

      <div class="drawer-panel active" id="dpanel-items">
        <div class="slot-scroll">
          <div class="tag-grid" id="itemsGrid">
            <div class="tag-empty">Loading tags…</div>
          </div>
        </div>

        <details class="tag-form">
          <summary>+ Write a new price tag</summary>
          <form id="addItemForm">
            <label>Item name<input type="text" id="newItemName" required></label>
            <label>Category
              <select id="newItemCategory" required></select>
            </label>
            <div class="tag-form-row">
              <label>Price<input type="number" step="0.01" id="newItemPrice" required></label>
              <label>Stock<input type="number" id="newItemStock" required></label>
            </div>
            <button type="submit">Hang tag</button>
            <span class="tag-form-msg" id="addItemMsg"></span>
          </form>
        </details>
      </div>

      <div class="drawer-panel" id="dpanel-categories">
        <div class="slot-scroll">
          <ul class="compartment-list" id="categoriesList">
            <li class="tag-empty">Loading…</li>
          </ul>
        </div>
      </div>

      <div class="drawer-panel" id="dpanel-audit">
        <div class="slot-scroll">
          <ul class="audit-list" id="auditList">
            <li class="tag-empty">Loading…</li>
          </ul>
        </div>
      </div>
    </div>
  </aside>

  <div class="drawer-scrim" id="drawerScrim"></div>

</div>

<script src="/static/app.js"></script>
</body>
</html>
